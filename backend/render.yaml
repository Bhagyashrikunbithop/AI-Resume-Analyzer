services:
  - type: web
    name: resume-analyzer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # needs ~2 GB RAM for Sentence-BERT + spaCy; the free plan may OOM
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-app.lovable.app
